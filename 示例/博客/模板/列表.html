{% 继承 "基础.html" %}
{% 块 标题 %}首页 · 我的博客{% 结束块 %}
{% 块 内容 %}
{{ 提示|安全 }}
{% 如果 文章列表 %}
<ul class="文章列表">
{% 遍历 文章 在 文章列表 %}
<li>
<a href="/文章/{{ 文章.id }}">{{ 文章.标题 }}</a>
<span class="浏览">{{ 文章.浏览数 }} 次浏览 · {{ 文章.分类 }}</span>
</li>
{% 结束遍历 %}
</ul>
{% 否则 %}
<p class="弱">还没有文章，去<a href="/文章/新建">写一篇</a>吧。</p>
{% 结束如果 %}
{% 结束块 %}
